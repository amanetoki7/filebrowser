http:
  listen: 127.0.0.1
  port: 8080
server:
  sources:
    - path: 'D:/クリエイティブ/Library'
      config:
        defaultEnabled: true
        readOnly: true
auth:
  adminUsername: admin
  methods:
    noauth: true
  noAuthReadOnly: true
userDefaults:
  ui:
    locale: ja
  account:
    disableSettings: true
    lockPassword: true
