http:
  listen: 0.0.0.0
  port: 8080
server:
  sources:
    - path: 'D:/クリエイティブ/Library'
      config:
        defaultEnabled: true
        readOnly: true
auth:
  adminUsername: 雨音とき
  methods:
    noauth: true
  noAuthReadOnly: true
userDefaults:
  ui:
    locale: ja
    customTheme: windows11
  sidebar:
    showTools: false
    hideFiles: true
  preview:
    folder: false
  listing:
    dateFormat: true
    gallerySize: 1
    viewMode: compact
  account:
    disableSettings: true
    lockPassword: true
frontend:
  disablePWAInstall: true
  styling:
    customCSS: custom.css
    customThemes:
      windows11:
        description: Windows 11 Fluent
        css: fluent-windows11.css
