http:
  listen: 0.0.0.0
  port: 8080
server:
  sources:
    - path: 'D:/クリエイティブ/Library'
      config:
        defaultEnabled: true
        readOnly: true
auth:
  adminUsername: 雨音とき
  methods:
    noauth: true
  noAuthReadOnly: true
userDefaults:
  ui:
    locale: ja
  sidebar:
    showTools: false
    hideFiles: true
  preview:
    folder: false
  account:
    disableSettings: true
    lockPassword: true
frontend:
  disablePWAInstall: true
  styling:
    customCSS: custom.css
